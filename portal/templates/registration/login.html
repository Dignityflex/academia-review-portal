{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 border border-gray-200 rounded-xl">
  <h2 class="text-2xl font-bold text-gray-900 mb-2">Log In</h2>
  <p class="text-sm text-gray-500 mb-6">Enter your credentials to access your reviews.</p>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <p class="text-xs text-red-500 mt-1">{{ field.errors.0 }}</p>
        {% endif %}
      </div>
    {% endfor %}
    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 text-sm rounded-lg transition">
      Log In
    </button>
  </form>
  <p class="text-xs text-center text-gray-500 mt-4">
    Don't have an account? <a href="{% url 'signup' %}" class="text-indigo-600 font-semibold hover:underline">Sign up</a>
  </p>
</div>
{% endblock %}
