<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AcademiaReview Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col">
  <nav class="bg-white border-b border-gray-200 px-6 py-4 flex justify-between items-center shadow-sm">
    <a href="/" class="text-xl font-bold tracking-tight text-indigo-600">AcademiaReview</a>
    <div class="space-x-4 flex items-center">
      {% if user.is_authenticated %}
        <span class="text-sm text-gray-600">Logged in as <strong class="text-gray-900">{{ user.username }}</strong></span>
        <a href="{% url 'submit_paper' %}" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-3.5 py-2 rounded-md transition">Submit Paper</a>
        <form action="{% url 'logout' %}" method="post" class="inline">
          {% csrf_token %}
          <button type="submit" class="text-sm text-gray-500 hover:text-gray-800 transition">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="text-sm font-semibold text-indigo-600 hover:text-indigo-700">Log in</a>
        <a href="{% url 'signup' %}" class="text-sm bg-gray-900 hover:bg-gray-800 text-white font-medium px-3.5 py-2 rounded-md transition">Sign up</a>
      {% endif %}
    </div>
  </nav>

  <main class="max-w-4xl w-full mx-auto p-6 flex-grow">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center py-6 text-xs text-gray-400 border-t border-gray-200 mt-auto">
    AcademiaReview • Full Stack Peer Review Demonstration
  </footer>
</body>
</html>
